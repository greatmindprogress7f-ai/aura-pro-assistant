<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Orb Assistant</title>
<style>
:root{--bg:#dfe7f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0f1a}}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none}
.stage{position:relative;width:100%;height:100%;--u:4px;overflow:hidden;isolation:isolate;
background:radial-gradient(90% 45% at 50% 0%,rgba(255,255,255,.16),transparent 70%),linear-gradient(180deg,#0a8bff 0%,#13b2ff 18%,#7fd3ff 33%,#d9f1ff 48%,#fff 63%)}
.rows{position:absolute;left:calc(50% - var(--u)*42);width:calc(var(--u)*84);top:58%;display:grid;gap:calc(var(--u)*4)}
.rows i{display:block;height:calc(var(--u)*11);border-radius:calc(var(--u)*4);background:#eef3fb}
.rows i:nth-child(2){width:78%}.rows i:nth-child(3){width:90%}
.halo{position:absolute;left:0;top:0;border-radius:50%;z-index:3;pointer-events:none;background:radial-gradient(circle,rgba(40,110,255,.5),rgba(90,80,255,.22) 40%,transparent 68%);opacity:0}
.orb{position:absolute;left:0;top:0;z-index:4;mix-blend-mode:multiply;pointer-events:none;will-change:transform}
.orb img{width:100%;display:block;will-change:transform,filter}
.spec{position:absolute;left:0;top:0;z-index:4;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 70%)}
.hit{position:absolute;left:0;top:0;z-index:5;border-radius:50%;cursor:grab;touch-action:none}
.fx{position:absolute;border-radius:50%;pointer-events:none;z-index:6}
.nav{position:absolute;left:calc(50% - var(--u)*23);width:calc(var(--u)*46);height:calc(var(--u)*13.6);bottom:calc(var(--u)*8);z-index:3;border-radius:99px;box-shadow:0 calc(var(--u)*2.2) calc(var(--u)*6) rgba(40,120,255,.38),0 0 calc(var(--u)*9) rgba(70,150,255,.25);will-change:transform}
.nbg{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:linear-gradient(135deg,rgba(80,200,255,.86),rgba(40,110,255,.86) 50%,rgba(120,100,255,.86));-webkit-backdrop-filter:blur(calc(var(--u)*2)) saturate(1.5);backdrop-filter:blur(calc(var(--u)*2)) saturate(1.5);box-shadow:inset 0 0 0 calc(var(--u)*.35) rgba(255,255,255,.45),inset 0 calc(var(--u)*-1.2) calc(var(--u)*3) rgba(20,60,200,.35),inset 0 calc(var(--u)*1.2) calc(var(--u)*2) rgba(255,255,255,.5)}
.nbl{position:absolute;border-radius:50%;filter:blur(calc(var(--u)*2.6));animation:ndr 3.4s ease-in-out infinite alternate}
.nbl.a{left:-6%;top:-40%;width:48%;height:150%;background:#35e8ff}
.nbl.b{left:30%;top:20%;width:46%;height:130%;background:#1747ff;animation-delay:-1.1s}
.nbl.c{right:-8%;top:-30%;width:46%;height:150%;background:#9a63ff;animation-delay:-2s}
@keyframes ndr{to{transform:translate(calc(var(--u)*6),calc(var(--u)*1.5)) scale(1.2)}}
.gloss{position:absolute;inset:0;background:radial-gradient(circle at var(--sx,50%) var(--sy,26%),rgba(255,255,255,calc(.28 + var(--hp,0)*.4)),transparent 55%),linear-gradient(180deg,rgba(255,255,255,.4),transparent 45%)}
.sel{position:absolute;top:50%;left:23%;width:calc(var(--u)*11.5);height:calc(var(--u)*9.4);border-radius:99px;background:radial-gradient(circle,rgba(255,255,255,.5),rgba(255,255,255,.12) 70%);box-shadow:inset 0 0 0 calc(var(--u)*.3) rgba(255,255,255,.4)}
.nb{position:absolute;top:50%;width:calc(var(--u)*11.5);height:calc(var(--u)*11.5);margin:calc(var(--u)*-5.75) 0 0 calc(var(--u)*-5.75);border:0;background:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.nb svg{width:calc(var(--u)*6.4);height:calc(var(--u)*6.4);fill:#fff;opacity:.82;filter:drop-shadow(0 calc(var(--u)*.4) calc(var(--u)*.8) rgba(20,50,170,.45));transition:opacity .25s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.nb.on svg{opacity:1;transform:scale(1.14)}
.rip{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.85),rgba(255,255,255,0) 70%);pointer-events:none}
.sheet{position:absolute;left:calc(50% - var(--u)*35);width:calc(var(--u)*70);bottom:calc(var(--u)*25);z-index:7;display:flex;flex-direction:column;align-items:flex-end;gap:calc(var(--u)*3);
transform:translateY(30%) scale(.94);opacity:0;pointer-events:none;transition:transform .6s cubic-bezier(.2,1.25,.3,1),opacity .35s}
.sheet.open{transform:none;opacity:1;pointer-events:auto}
.chip{display:flex;align-items:center;gap:calc(var(--u)*1.8);border:0;background:#fff;color:#222;font:inherit;font-size:calc(var(--u)*3);padding:calc(var(--u)*2) calc(var(--u)*3.6);border-radius:99px;box-shadow:0 calc(var(--u)*2) calc(var(--u)*6) rgba(30,60,120,.18);cursor:pointer}
.sp{width:calc(var(--u)*3);height:calc(var(--u)*3);border:calc(var(--u)*.5) dashed #444;border-radius:50%;animation:spin 2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{position:relative;width:100%;background:#fff;border-radius:calc(var(--u)*5.5);padding:calc(var(--u)*5) calc(var(--u)*4) calc(var(--u)*3);box-shadow:0 calc(var(--u)*3) calc(var(--u)*9) rgba(30,60,120,.22);color:#111}
.card:before{content:"";position:absolute;top:calc(var(--u)*1.5);left:50%;width:calc(var(--u)*9);height:calc(var(--u)*.9);margin-left:calc(var(--u)*-4.5);border-radius:9px;background:#d3d8e0}
.txt{font-size:calc(var(--u)*3.4);line-height:1.5;min-height:calc(var(--u)*21)}
.w{opacity:0;transition:opacity .25s}.w.v{opacity:1}.w.b{font-weight:700}
.acts{display:flex;align-items:center;gap:calc(var(--u)*4.5);margin-top:calc(var(--u)*2.5)}
.ic{background:none;border:0;padding:calc(var(--u)*1);color:#222;display:flex;cursor:pointer}
.ic svg{width:calc(var(--u)*4.6);height:calc(var(--u)*4.6);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.on{color:#0b63ff}.ic:last-child{margin-left:auto}
.hint{position:absolute;left:0;right:0;bottom:calc(var(--u)*2.5);text-align:center;font-size:calc(var(--u)*3);color:#7a8aa8;transition:opacity .4s;z-index:1}
@media (prefers-reduced-motion: reduce){.spec{display:none}.nbl{animation:none}}
</style></head>

<main class="stage" id="st">
  <div class="rows"><i></i><i></i><i></i></div>
  <nav class="nav" id="nav" aria-label="Main">
    <div class="nbg"><div class="nbl a"></div><div class="nbl b"></div><div class="nbl c"></div><div class="gloss"></div><div class="sel" id="sel"></div></div>

    <button class="nb" style="left:50%" aria-label="Chat"><svg viewBox="0 0 24 24"><path stroke="#fff" stroke-width="1.2" stroke-linejoin="round" d="M12.6 3.4a7.4 7.4 0 0 0-6.4 11.1l-1.4 3.9 4.1-1.1A7.4 7.4 0 1 0 12.6 3.4z"/><path fill="none" stroke="#2f7bff" stroke-width="1.6" stroke-linecap="round" d="M9.6 9.4h6M9.6 12.4h4"/></svg></button>
    <button class="nb" style="left:77%" aria-label="Profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="7.8" r="4"/><path d="M4.4 20.4c0-3.9 3.3-6.4 7.6-6.4s7.6 2.5 7.6 6.4c0 .6-.4 1-1 1H5.4c-.6 0-1-.4-1-1z"/></svg></button>
  </nav>

function sparks(x,y,n){for(let i=0;i<n;i++){const d=5+Math.random()*6,e=document.createElement('div');e.className='fx';

function minimise(){sheet.classList.remove('open');clearTimeout(ty);tone(520,.4,.08);tone(330,.5,.07);
setTimeout(()=>{orb.style.opacity=1;fly({x:ISL.x,y:ISL.y},home,.9,DS,1,0,-360,'float',null,()=>{S.x=T.x=home.x;S.y=T.y=home.y;S.vs+=.12;ring(home.x,home.y,2.4,'rgba(60,120,255,.7)',900);sparks(home.x,home.y,8);buzz(20)})},260)}

(function n(){if(i<sp.length){sp[i++].classList.add('v');ty=setTimeout(n,45)}})()}
